<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soft Drinks</title>
  <link rel="stylesheet" href="Style/header.css">
  <link rel="stylesheet" href="Style/footer.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Style/softDrink.css">
</head>

<body class="d-flex flex-column">
  <div class="header-container sticky-top" id="header"></div>

  
  <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner" style="height: 30rem;">
      <div class="carousel-item active" style="height: 100%; width: 100%;">
        <div style="background-image: url('../Resources/soft-drinks-bg.jpg'); background-size: cover; background-position: center; height: 100%; width: 100%;"></div>
        <div style="background-color: rgba(0, 0, 0, 0.5); height: 100%; width: 100%; position: absolute; top: 0; left: 0;"></div>
        <div class="carousel-caption">
          <h1>REFRESHING SOFT DRINKS</h1>
          <p>Cool down with our selection of carbonated beverages</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container my-5 py-5">
    <h1 class="fw-bold mb-5">Soft Drinks Menu</h1>
    <div class="row my-5 gx-5" id="products"></div>
  </div>

  <div class="footer-container" id="footer"></div>

  <script src="/Script/softDrink.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
