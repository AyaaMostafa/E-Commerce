<div class="testimonials-section" style="padding: 60px 0; background-color: #F8F8F8;">
    <div class="container" style="max-width: 1200px; margin: 0 auto;">
        <h2 style="text-align: center; font-size: 2.5rem; color: #3B3B3B; margin-bottom: 50px; position: relative;">
            What people say about ATAM?
            <span style="display: block; width: 80px; height: 3px; background: #F88C5E; margin: 15px auto 0;"></span>
        </h2>
        
        <div class="review-form-container" style="background: white; border-radius: 12px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 60px;">
            <h3 style="color: #3B3B3B; font-size: 1.8rem; margin-bottom: 25px; text-align: center;">Share Your Experience</h3>
            <form id="reviewForm" style="max-width: 700px; margin: 0 auto;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px;">
                    <div>
                        <label for="reviewerName" style="display: block; margin-bottom: 8px; color: #3B3B3B; font-weight: 500;">Your Name</label>
                        <input type="text" id="reviewerName" required 
                               style="width: 100%; padding: 12px 15px; border: 1px solid #E5E5E5; border-radius: 8px; font-size: 1rem; transition: all 0.3s ease;">
                    </div>
                    <div>
                        <label for="reviewTitle" style="display: block; margin-bottom: 8px; color: #3B3B3B; font-weight: 500;">Review Title</label>
                        <input type="text" id="reviewTitle" required 
                               style="width: 100%; padding: 12px 15px; border: 1px solid #E5E5E5; border-radius: 8px; font-size: 1rem; transition: all 0.3s ease;">
                    </div>
                </div>
                
                <div style="margin-bottom: 25px;">
                    <label for="reviewText" style="display: block; margin-bottom: 8px; color: #3B3B3B; font-weight: 500;">Your Review</label>
                    <textarea id="reviewText" rows="4" required 
                              style="width: 100%; padding: 15px; border: 1px solid #E5E5E5; border-radius: 8px; font-size: 1rem; transition: all 0.3s ease;"></textarea>
                </div>
                
                <div style="margin-bottom: 30px;">
                    <label style="display: block; margin-bottom: 8px; color: #3B3B3B; font-weight: 500;">Rating</label>
                    <div class="star-rating" style="font-size: 28px; letter-spacing: 5px;">
                        <span class="star" data-value="1" style="cursor: pointer; transition: all 0.2s ease;">★</span>
                        <span class="star" data-value="2" style="cursor: pointer; transition: all 0.2s ease;">★</span>
                        <span class="star" data-value="3" style="cursor: pointer; transition: all 0.2s ease;">★</span>
                        <span class="star" data-value="4" style="cursor: pointer; transition: all 0.2s ease;">★</span>
                        <span class="star" data-value="5" style="cursor: pointer; transition: all 0.2s ease;">★</span>
                    </div>
                    <input type="hidden" id="reviewRating" value="5">
                </div>
                
                <div style="text-align: center;">
                    <button type="submit" 
                            style="background-color: #F88C5E; color: white; padding: 14px 35px; border: none; border-radius: 8px; 
                                   font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
                                   box-shadow: 0 4px 15px rgba(248, 140, 94, 0.3);">
                        Submit Review
                        <span style="margin-left: 8px;">→</span>
                    </button>
                </div>
            </form>
        </div>

       
        <div class="testimonial-wrapper">
            <div class="testimonial-container" id="testimonialContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px;">
             
                <div class="testimonial-card" style="background: white; border-radius: 12px; padding: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); transition: transform 0.3s ease;">
                    <img src="/Resources/check (1).png" alt="check" style="width: 24px; height: 24px; margin-bottom: 15px;">
                    <div style="color: #F88C5E; font-size: 1.2rem; margin-bottom: 10px;">★★★★★</div>
                    <h4 style="color: #3B3B3B; font-size: 1.3rem; margin-bottom: 15px;">Favorite place</h4>
                    <p style="color: #666; line-height: 1.6; margin-bottom: 20px; font-style: italic;">"This is my absolute favorite restaurant in New Cairo. The food is always fantastic and no matter what I order I am always delighted with my meal!"</p>
                    <p style="color: #3B3B3B; font-weight: 600;">Nour Essam <span style="color: #A9B0B8; font-weight: normal;">- 16/08/2022</span></p>
                </div>
                
                More testimonial cards...
            </div>
        </div>
    </div>
</div>

<script>
    
    document.querySelectorAll('.star').forEach(star => {
       
        if(star.getAttribute('data-value') <= 5) {
            star.style.color = '#F88C5E';
        }
        
        star.addEventListener('click', function() {
            const value = this.getAttribute('data-value');
            document.getElementById('reviewRating').value = value;
            
            document.querySelectorAll('.star').forEach(s => {
                s.style.color = s.getAttribute('data-value') <= value ? '#F88C5E' : '#D3D8DE';
            });
        });
        
        star.addEventListener('mouseover', function() {
            const hoverValue = this.getAttribute('data-value');
            document.querySelectorAll('.star').forEach(s => {
                if(s.getAttribute('data-value') <= hoverValue) {
                    s.style.transform = 'scale(1.2)';
                }
            });
        });
        
        star.addEventListener('mouseout', function() {
            document.querySelectorAll('.star').forEach(s => {
                s.style.transform = 'scale(1)';
            });
        });
    });


    document.getElementById('reviewForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
       
        const name = document.getElementById('reviewerName').value;
        const title = document.getElementById('reviewTitle').value;
        const text = document.getElementById('reviewText').value;
        const rating = document.getElementById('reviewRating').value;
        const date = new Date().toLocaleDateString('en-GB');
        
      
        const newReview = document.createElement('div');
        newReview.className = 'testimonial-card';
        newReview.style.opacity = '0';
        newReview.style.transform = 'translateY(20px)';
        newReview.innerHTML = `
            <img src="/Resources/check (1).png" alt="check" style="width: 24px; height: 24px; margin-bottom: 15px;">
            <div style="color: #F88C5E; font-size: 1.2rem; margin-bottom: 10px;">${'★'.repeat(rating)}${'☆'.repeat(5-rating)}</div>
            <h4 style="color: #3B3B3B; font-size: 1.3rem; margin-bottom: 15px;">${title}</h4>
            <p style="color: #666; line-height: 1.6; margin-bottom: 20px; font-style: italic;">"${text}"</p>
            <p style="color: #3B3B3B; font-weight: 600;">${name} <span style="color: #A9B0B8; font-weight: normal;">- ${date}</span></p>
        `;
        
        
        const container = document.getElementById('testimonialContainer');
        container.prepend(newReview);
      
        setTimeout(() => {
            newReview.style.opacity = '1';
            newReview.style.transform = 'translateY(0)';
            newReview.style.transition = 'all 0.4s ease-out';
        }, 10);
        
        
        this.reset();
        document.getElementById('reviewRating').value = 5;
        document.querySelectorAll('.star').forEach(s => {
            s.style.color = s.getAttribute('data-value') <= 5 ? '#F88C5E' : '#D3D8DE';
        });
        
        const notification = document.createElement('div');
        notification.textContent = 'Thank you for your review!';
        notification.style.position = 'fixed';
        notification.style.bottom = '30px';
        notification.style.right = '30px';
        notification.style.backgroundColor = '#88A27E';
        notification.style.color = 'white';
        notification.style.padding = '15px 25px';
        notification.style.borderRadius = '8px';
        notification.style.boxShadow = '0 5px 15px rgba(0,0,0,0.1)';
        notification.style.zIndex = '1000';
        notification.style.opacity = '0';
        notification.style.transform = 'translateY(20px)';
        notification.style.transition = 'all 0.3s ease';
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.style.opacity = '1';
            notification.style.transform = 'translateY(0)';
        }, 100);
        
        setTimeout(() => {
            notification.style.opacity = '0';
            setTimeout(() => notification.remove(), 300);
        }, 3000);
    });
</script>
