
<!-- هنا filter خللي بالك -->

<div class="filter-sidebar">
    <h2>Filter by</h2>
    
    <div class="filter-section">
        <h3>Categories</h3>
        <div class="filter-option">
            <input type="checkbox" id="burger" />
            <label for="burger">Burger</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="pizza" />
            <label for="pizza">Pizza</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="pasta" />
            <label for="pasta">Pasta</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="sandwich" />
            <label for="sandwich">Sandwich</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="softDrink" />
            <label for="softDrink">Soft Drinks</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="hotDrink" />
            <label for="hotDrink">Hot Drinks</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="freshJuice" />
            <label for="freshJuice">Fresh Juice</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="cake" />
            <label for="cake">Cake</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="brownies" />
            <label for="brownies">Brownies</label>
        </div>
        <div class="filter-option">
            <input type="checkbox" id="iceCream" />
            <label for="iceCream">Ice Cream</label>
        </div>
    </div>

    <div class="filter-section">
        <h3>Price Range</h3>
        <div class="filter-option">
            <input type="radio" id="price80" name="price" value="80" />
            <label for="price80">Up to $80</label>
        </div>
        <div class="filter-option">
            <input type="radio" id="price120" name="price" value="120" />
            <label for="price120">Up to $120</label>
        </div>
        <div class="filter-option">
            <input type="radio" id="price200" name="price" value="200" />
            <label for="price200">Up to $200</label>
        </div>
    </div>

    <div class="filter-actions">
        <button id="applyFilter" class="filter-btn">Apply Filter</button>
        <button id="clearFilter" class="filter-btn secondary">Clear All</button>
    </div>
    
    <button id="filterToggle" class="filter-toggle">☰ Filters</button>
</div>
