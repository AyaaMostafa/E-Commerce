<div class="filter-sidebar">
    <h2>Filter by Price</h2>

    <div class="filter-section">
        <h3>Price Range</h3>
        <div class="filter-option">
            <input type="radio" id="price80" name="price" value="80" />
            <label for="price80">Up to $80</label>
        </div>
        <div class="filter-option">
            <input type="radio" id="price120" name="price" value="120" />
            <label for="price120">Up to $120</label>
        </div>
        <div class="filter-option">
            <input type="radio" id="price200" name="price" value="200" />
            <label for="price200">Up to $200</label>
        </div>
    </div>

    <div class="filter-actions">
        <button id="applyFilter" class="filter-btn">Apply Filter</button>
        <button id="clearFilter" class="filter-btn secondary">Clear All</button>
    </div>
    
   
</div>
