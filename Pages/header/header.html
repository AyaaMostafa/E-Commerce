<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Header</title>
  <link rel="stylesheet" href="/Style/header.css" />
</head>
<body>
  <div class="header-container">
    <div class="nav-bar">
      <div class="nav-links">
        <a href="../aboutUs/aboutUs.html">About Us</a>
        <a href="../customerSupport/customerSupport.html">Customer Support</a>
      </div>

      <div class="nav-details" id="details">
        Get 20% off your first order. <a href="/Pages/subscribe/Subscribe.html">Subscribe</a>
      </div>

      <div class="login">
        <img src="/Resources/icons8-login-50.png" alt="user-icon" />
        <a href="../login/login.html">Log In</a>
      </div>
    </div>

    <div class="main-header">
      <div class="logo">ATAM</div>

      <div class="search">
        <input type="text" placeholder="Search a product e.g. milk" />
        <button><img src="/Resources/search-12-xxl.png" alt="search" /></button>
      </div>

      <div class="icons">
        <img src="/Resources/icons8-location-50.png" alt="location" />
        <img src="/Resources/icons8-heart-50.png" alt="favorite" />
        <img src="/Resources/cart-11-xxl.png" alt="cart" />
        <span class="count">0</span>
      </div>
    </div>
    
  </div>
</body>
</html>
