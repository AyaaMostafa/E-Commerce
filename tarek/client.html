<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1f1f1f;
            color: #fff;
            padding: 40px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff7e3f;
            font-size: 28px;
            margin: 0;
        }
        p {
            font-size: 16px;
            color: #ccc;
        }
        .action-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: #ff7e3f;
            color: #fff;
            cursor: pointer;
        }
        .action-btn:hover {
            background: #fff;
            color: #ff7e3f;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Client Dashboard</h1>
        <button class="action-btn" onclick="window.location.href='index.html'">Logout</button>
    </div>
    <p>Browse and order your favorite meals here.</p>
</body>
</html>
